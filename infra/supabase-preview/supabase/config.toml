# Remote settings for the `geraiexpress-preview` Supabase project (T-018, DEL-1 stage 2).
# Applied deliberately with:
#   secrets-env run -- pnpm exec supabase config push --workdir infra/supabase-preview \
#     --project-ref jezxplwwmjogrmlixdcw
# Never push supabase/config.toml (local test values). Secrets come from the secrets store
# through env(); nothing secret is written here.
project_id = "geraiexpress-preview"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://geraiexpress-preview.ongki.workers.dev"
additional_redirect_urls = ["https://geraiexpress-preview.ongki.workers.dev"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Signup must be on for anonymous demo sessions; private.before_user_created still refuses real
# accounts while registration is closed (private.settings, default closed).
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false
minimum_password_length = 10

[auth.rate_limit]
# Server-side Auth calls arrive from Cloudflare's egress, shared by many visitors; the Worker
# limits each visitor first (RATE-1), so these per-IP limits are sized for aggregate traffic.
email_sent = 30
sms_sent = 1
anonymous_users = 300
token_refresh = 1500
sign_in_sign_ups = 300
token_verifications = 300
web3 = 30

# Off on the preview until a real Turnstile widget exists: a test secret would look enabled and
# pass every token. The Worker's per-visitor limits and the anonymous mail refusal still apply.
[auth.captcha]
enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_user_created"

# DEC-009: Auth email is delivered by the Worker. Until MAIL_TRANSPORT is configured on the
# Worker, every send fails closed (no Auth email on the preview).
[auth.hook.send_email]
enabled = true
uri = "https://geraiexpress-preview.ongki.workers.dev/api/auth/send-email"
secrets = "env(GERAIEXPRESS_PREVIEW_SEND_EMAIL_HOOK_SECRET)"

[storage]
enabled = false
